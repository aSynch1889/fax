name: FaxFlow
options:
  bundleIdPrefix: com.evolly.faxflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone & iPad
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FaxFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evolly.faxflow
        PRODUCT_NAME: "FaxFlow"
        INFOPLIST_FILE: "Supporting Files/Info.plist"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZED_STRING_SWIFT_DATA_STORE_TYPE: "xcstrings"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREENSHOT_MODE"
    frameworks:
      - sdk: PDFKit.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: StoreKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: AVFoundation.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: QuickLook.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: WebKit.framework
